# Monta o pacote dos produtores (tools/portatil/montar-pacote.ps1 -SoApp) e publica o .zip e o SHA256SUMS.txt,
# fora do zip, como arquivos de uma release em RASCUNHO. O dono do repositório confere e publica.
# O guia está em docs/portatil.md, seção 2f, e em docs/como-rodar.md, seção 13.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Nome da tag da release (ex.: v0.2.0-beta). O commit é o do branch ou tag escolhido acima.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  pacote:
    name: Compilar, testar e montar o pacote
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # a tag vem do disparo manual ou do push; só letras, números, ponto, hífen e sublinhado (vira nome de arquivo e de branch)
      - name: Versão
        id: versao
        env:
          VERSAO: ${{ github.event.inputs.versao || github.ref_name }}
        run: |
          if ($env:VERSAO -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,60}$') { Write-Host "Parei: nome de versão inválido: $env:VERSAO"; exit 1 }
          "versao=$env:VERSAO" >> $env:GITHUB_OUTPUT

      - name: Submódulos (Tracktion e JUCE)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git submodule update --init external/tracktion_engine
          git -C external/tracktion_engine config submodule.modules/juce.url https://github.com/juce-framework/JUCE.git
          git -C external/tracktion_engine submodule update --init --depth 1

      - name: Ambiente do MSVC
        run: ./tools/ci/ambiente-msvc.ps1

      # O pacote exige o LAME no exe (sem ele o MP3 fica desligado); o ASIO vai junto, como nos builds de mão.
      - name: LAME e ASIO SDK (baixar, conferir o sha256, extrair)
        run: ./tools/ci/terceiros.ps1 -Baixar -Exigir

      # Do zero, sem cache: o que vai para quem usa não reaproveita objeto de outro build. Sem WHYNOT_WERROR
      # nem outra opção: é o build do docs/como-rodar.md.
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build -j 4

      - name: ctest
        run: ctest --test-dir build --output-on-failure --timeout 600

      - name: Autoteste (--self-test)
        run: ./tools/ci/autoteste.ps1 -Relatorio build\selftest\relatorio.txt

      - name: Publicar o relatório do autoteste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoteste-relatorio
          path: build/selftest/relatorio.txt
          if-no-files-found: warn

      # ASSINATURA DE CÓDIGO (desligada). O caminho está em docs/portatil.md, seção 2f: a SignPath Foundation assina
      # de graça projetos de código aberto aprovados, e quem pede é o dono do repositório. Com o projeto aprovado:
      # 1. publique o exe como artifact (actions/upload-artifact, guardando o "artifact-id" do passo);
      # 2. ligue o passo abaixo, com os dados que a SignPath der e o segredo SIGNPATH_API_TOKEN no repositório;
      # 3. aponte o -Exe do "Montar o pacote" para o exe assinado (assinado\WHYNOT LAB.exe).
      # O exe tem de ser assinado ANTES de montar o pacote: o zip e o SHA256SUMS.txt levam o hash do exe final.
      #
      # - name: Assinar o exe (SignPath)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <id da organização na SignPath>
      #     project-slug: whynot-lab
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: assinado

      # O montar-pacote.ps1 quer um branch aberto (não uma tag solta) e a pasta Músicas do usuário.
      - name: Montar o pacote (-SoApp -Zip)
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git switch --create "release-$env:VERSAO"
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE 'Music'), dist | Out-Null
          $destino = Join-Path $env:GITHUB_WORKSPACE "dist\WHYNOT-LAB-app-$env:VERSAO"
          ./tools/portatil/montar-pacote.ps1 -SoApp -Zip -Ramo "release-$env:VERSAO" -Destino $destino
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # o hash fica FORA do zip: quem baixa confere o arquivo inteiro antes de abrir
          $zip = Get-Item -LiteralPath "$destino.zip"
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $zip.DirectoryName 'SHA256SUMS.txt'), "$hash  $($zip.Name)`n")
          Write-Host "$hash  $($zip.Name)"

      - name: Guardar o zip e o SHA256SUMS.txt
        uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  #----------------------------------------------------------------------------
  # Só este job escreve no repositório, e ele não roda código do projeto: baixa os dois arquivos e cria a release.
  publicar:
    name: Release em rascunho
    needs: pacote
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacote
          path: dist

      # Em rascunho: nada fica público até o dono do repositório conferir e clicar em "Publish release".
      # Se a release da tag já existe, os arquivos entram nela; arquivo com o mesmo nome não é trocado (o gh para).
      - name: Criar a release em rascunho com o zip e o SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ needs.pacote.outputs.versao }}
        run: |
          $arquivos = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release view $env:VERSAO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSAO @arquivos
          }
          else {
            gh release create $env:VERSAO @arquivos --draft --target $env:GITHUB_SHA --title "WHYNOT LAB $env:VERSAO" --notes "Pacote para Windows 10 e 11 (64 bits). Confira o sha256 do zip com o SHA256SUMS.txt antes de extrair: Get-FileHash <arquivo.zip>"
          }
          exit $LASTEXITCODE
